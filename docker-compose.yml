version: '3'

services:
  jekyll:
    image: jekyll/jekyll:pages
    container_name: my-jekyll-site
    user: root
    command: bash -c "bundle install && bundle exec jekyll serve --watch --force_polling --host 0.0.0.0"
    ports:
      - "4000:4000"
    volumes:
      - ./:/srv/jekyll   # <-- Remove the extra quote at the end